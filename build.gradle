plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

allprojects {
	apply plugin: 'fabric-loom'
	apply plugin: 'maven-publish'

	version = rootProject.mod_version
	group = rootProject.maven_group

	repositories {
		mavenCentral()
	}

	loom {
		def accessWidenerFile = project(":zeroseek-base").file("src/main/resources/zeroseek.accesswidener")
		if (accessWidenerFile.exists()) {
			accessWidenerPath = accessWidenerFile
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

		testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
		testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	}

	test {
		useJUnitPlatform()
		jvmArgs += ['--add-modules', 'jdk.incubator.vector']
	}

	processResources {
		inputs.property "version", project.version

		filesMatching("fabric.mod.json") {
			expand "version": inputs.properties.version
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 22
		it.options.encoding = "UTF-8"
		it.options.compilerArgs.addAll(['--add-modules', 'jdk.incubator.vector'])
	}

	java {
		withSourcesJar()
		sourceCompatibility = JavaVersion.VERSION_22
		targetCompatibility = JavaVersion.VERSION_22
	}
}

subprojects.forEach { remapJar.dependsOn("${it.path}:remapJar") }

dependencies {
	afterEvaluate {
		subprojects.forEach {
			if (it.parent != rootProject) return

			def projectName = it.name
			api project(path: ":${projectName}", configuration: "namedElements")
			include project(":${projectName}")
		}
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}